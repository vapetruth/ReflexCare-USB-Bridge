plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'th.ac.reflexcare.usbbridge'
    compileSdk 35
    defaultConfig {
        applicationId 'th.ac.reflexcare.usbbridge'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'com.github.mik3y:usb-serial-for-android:3.12.0'
}
